name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch Electron binary
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node node_modules/electron/install.js

      - name: Build web app
        run: npm run build

      - name: Package portable exe
        run: npx electron-builder --win portable --publish never

      - name: Stage ASCII-named artifact
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "release/图片对比查看器 ${VERSION}.exe" "image-compare-viewer-win-x64-v${VERSION}.exe"
          ls -lh image-compare-viewer-win-x64-v${VERSION}.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: image-compare-viewer-win-x64-v*.exe
          generate_release_notes: true
